<meta name="mobile-web-app-capable" content="yes">

<script>
  (function () {

<link rel="preconnect" href="https://fonts.googleapis.com">

<body>
<main>
  <header>
    <div class="brand">
      <div class="dot"></div>
      <div>
        <h1>Rosa</h1>
        <div class="sub" id="updated">Loading…</div>
      </div>
    </div>
    <div class="actions">
      <button id="theme" class="icon-btn" type="button" aria-label="Switch light/dark mode" title="Switch light/dark mode">
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
        </svg>
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
        </svg>
      </button>
    </div>
  </header>

  <nav class="tabs" aria-label="Pages">
    <a href="./">Dashboard</a>
    <a href="trips">Trips</a>
    <a href="stats" aria-current="page"><span class="long">Statistics</span><span class="short">Stats</span></a>
    <a href="service"><span class="long">Service &amp; Maintenance</span><span class="short">Service</span></a>
  </nav>

  <div class="banner err" id="error"></div>
  <div class="banner info" id="info"></div>

  <div class="seg" role="tablist" aria-label="Period">
    <button type="button" class="on" data-period="week" role="tab" aria-selected="true">Weekly</button>
    <button type="button" data-period="month" role="tab" aria-selected="false">Monthly</button>
  </div>

  <section class="grid">
    <article class="card span-12">
      <h2 id="kpi-title">This week so far</h2>
      <div class="kpis">
        <div class="kpi"><div class="l">Petrol used</div><div class="v" id="k-fuel">–</div><div class="delta" id="d-fuel"></div></div>
        <div class="kpi"><div class="l">Distance</div><div id="k-dist"><div class="v">–</div></div><div class="delta" id="d-dist"></div></div>
        <div class="kpi"><div class="l">Trips</div><div class="v" id="k-trips">–</div><div class="delta" id="d-trips"></div></div>
      </div>
    </article>

    <article class="card span-6">
      <h2 id="fuel-title">Petrol used per week</h2>
      <div class="chart" id="fuel-chart"></div>
    </article>
    <article class="card span-6">
      <h2 id="dist-title">Distance per week</h2>
      <div class="chart" id="dist-chart"></div>
    </article>

    <article class="card span-12">
      <h2 id="table-title">Every week</h2>
      <table>
        <thead><tr>
          <th id="th-period">Week of</th><th class="num">Trips</th><th class="num">Distance</th>
          <th class="num">Petrol</th><th class="num">Economy</th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </article>
  </section>
</main>

<script src="static/common.js?v=2"></script>
<script>
const SHOWN = 12; // periods in each chart
const SVG = "http://www.w3.org/2000/svg";
let period = "week", data = null;

const isWeek = () => period === "week";
const label = (iso, long = false) => new Date(iso + "T12:00:00").toLocaleDateString("en-GB",
  isWeek() ? { day: "numeric", month: "short", ...(long ? { year: "numeric" } : {}) }
           : { month: long ? "long" : "short", ...(long ? { year: "numeric" } : {}) });

// Round the axis top up to 1, 2 or 5 × 10^n and use 4 even ticks.
function niceMax(v) {
  if (!v) return 4;
  const p = 10 ** Math.floor(Math.log10(v / 4));
  const step = [1, 2, 2.5, 5, 10].map((m) => m * p).find((s) => s * 4 >= v);
  return step * 4;
}

function el(name, attrs = {}, parent) {
  const n = document.createElementNS(SVG, name);
  for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
  parent?.appendChild(n);
  return n;
}

// Columns, one series, oldest left. The bar is the hover/focus target (with a wider hit area).
function columnChart(host, items, value, describe) {
  host.textContent = "";
  const W = Math.max(280, host.clientWidth), H = 220;
  const pad = { top: 10, right: 4, bottom: 26, left: 40 };
  const plotW = W - pad.left - pad.right, plotH = H - pad.top - pad.bottom;
  const max = niceMax(Math.max(...items.map(value)));
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": host.dataset.label || "" }, host);

  for (let i = 0; i <= 4; i++) {
    const y = pad.top + plotH - (plotH * i) / 4;
    el("line", { class: "grid-line", x1: pad.left, x2: W - pad.right, y1: y, y2: y }, svg);
    el("text", { class: "tick", x: pad.left - 6, y: y + 4, "text-anchor": "end" }, svg).textContent = fmt.n((max * i) / 4, max < 8 ? 1 : 0);
  }

  const slot = plotW / items.length;
  const bw = Math.min(24, slot - 2);
  const tip = document.createElement("div");
  tip.className = "tip"; tip.hidden = true;
  host.appendChild(tip);

  items.forEach((p, i) => {
    const v = value(p);
    const h = max ? (plotH * v) / max : 0;
    const x = pad.left + slot * i + (slot - bw) / 2;
    const y0 = pad.top + plotH;
    const hit = el("rect", { class: "hit", x: pad.left + slot * i, y: pad.top, width: slot, height: plotH, tabindex: 0,
                            "aria-label": `${label(p.start, true)}: ${describe(p)}` }, svg);
    // 4px rounded top, square at the baseline.
    const r = Math.min(4, h, bw / 2);
    el("path", { class: `bar${p.current ? " partial" : ""}`,
      d: h <= 0 ? "" : `M${x},${y0} V${y0 - h + r} Q${x},${y0 - h} ${x + r},${y0 - h} H${x + bw - r} Q${x + bw},${y0 - h} ${x + bw},${y0 - h + r} V${y0} Z` }, svg);
    const show = () => {
      tip.hidden = false;
      tip.replaceChildren();
      const b = document.createElement("b"); b.textContent = describe(p);
      tip.append(b, `${label(p.start, true)}${p.current ? " · so far" : ""}`);
      tip.style.left = `${((x + bw / 2) / W) * 100}%`;
      tip.style.top = `${((y0 - h) / H) * host.querySelector("svg").getBoundingClientRect().height}px`;
    };
    hit.addEventListener("pointerenter", show);
    hit.addEventListener("focus", show);
    hit.addEventListener("pointerleave", () => { tip.hidden = true; });
    hit.addEventListener("blur", () => { tip.hidden = true; });

    // Skip labels so each has ~48px (a "27 Jul" label is about 40px wide).
    const every = Math.ceil(48 / slot);
    if ((items.length - 1 - i) % every === 0) {
      el("text", { class: "tick", x: x + bw / 2, y: H - 8, "text-anchor": "middle" }, svg).textContent = label(p.start);
    }
  });
}

function delta(prev, unit, digits = 0) {
  if (prev == null) return "";
  return `vs ${fmt.n(prev, digits)}${unit} ${isWeek() ? "last week" : "last month"}`;
}

function render() {
  const ps = data.periods, u = data.units;
  const cur = ps[0], prev = ps[1];
  const w = isWeek() ? "week" : "month";
  $("kpi-title").textContent = `This ${w} so far`;
  $("fuel-title").textContent = `Petrol used per ${w} (litres)`;
  $("dist-title").textContent = `Distance per ${w} (${u.distance})`;
  $("table-title").textContent = (isWeek() ? "Every week" : "Every month") + (data.since ? ` · since ${fmt.date(data.since)}` : "");
  $("th-period").textContent = isWeek() ? "Week of" : "Month";
  $("info").textContent = data.mock ? "Mock mode: sample trips, not your car." : "";
  $("info").classList.toggle("show", !!data.mock);

  $("k-fuel").innerHTML = cur ? `${fmt.n(cur.fuel_litres, 1)}<span class="unit">L</span>` : "–";
  $("k-dist").innerHTML = bigDual(cur?.distance, "distance", u, "v");
  $("k-trips").textContent = cur ? fmt.n(cur.trips) : "–";
  $("d-fuel").textContent = delta(prev?.fuel_litres, " L", 1);
  $("d-dist").textContent = delta(prev?.distance, ` ${u.distance}`);
  $("d-trips").textContent = delta(prev?.trips, "");

  const shown = ps.slice(0, SHOWN).reverse();
  $("fuel-chart").dataset.label = `Petrol used per ${w}, last ${shown.length}`;
  $("dist-chart").dataset.label = `Distance per ${w}, last ${shown.length}`;
  columnChart($("fuel-chart"), shown, (p) => p.fuel_litres, (p) => `${fmt.n(p.fuel_litres, 1)} L`);
  columnChart($("dist-chart"), shown, (p) => p.distance, (p) => `${fmt.n(p.distance)} ${u.distance}`);

  $("rows").innerHTML = ps.map((p) => `<tr>
      <td>${esc(label(p.start, true))}${p.current ? ' <span class="sub">so far</span>' : ""}</td>
      <td class="num">${fmt.n(p.trips)}</td>
      <td class="num">${inlineDual(p.distance, "distance", u)}</td>
      <td class="num">${fmt.n(p.fuel_litres, 1)} L</td>
      <td class="num">${inlineDual(p.avg_consumption, "consumption", u)}</td>
    </tr>`).join("") || `<tr><td colspan="5" class="empty">No trips stored yet.</td></tr>`;
}

async function load() {
  try {
    data = await api(`api/stats?period=${period}`, { remember: true });
    $("error").classList.remove("show");
    render();
  } catch (err) {
    $("error").textContent = `Couldn't load statistics: ${err.message}`;
    $("error").classList.add("show");
  }
}

document.querySelectorAll(".seg button").forEach((btn) =>
  btn.addEventListener("click", () => {
    document.querySelectorAll(".seg button").forEach((x) => {
      x.classList.toggle("on", x === btn);
      x.setAttribute("aria-selected", x === btn ? "true" : "false");
    });
    period = btn.dataset.period;
    load();
  }));

let resizeTimer = null;
window.addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => data && render(), 150); });
document.addEventListener("visibilitychange", () => { if (!document.hidden) { load(); syncUpdated(); } });
data = lastSeen.get(`api/stats?period=${period}`);
if (data) render();
load();
syncUpdated();
setInterval(syncUpdated, 60_000);
</script>
</body>
</html>
